name: Integração MySQL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration_root
          MYSQL_DATABASE: infra_test
          MYSQL_USER: infra_test
          MYSQL_PASSWORD: infra_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: application/pom.xml
      - name: Validar schema vazio, migrations e inicialização
        run: bash mvnw --batch-mode --no-transfer-progress -Pmysql-integration clean verify
