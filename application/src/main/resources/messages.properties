# Mensagens de erro da API (INFRA-03, #56).
#
# Bundle base em pt-BR. A chave e o identificador estavel da mensagem; o
# GlobalExceptionHandler resolve no idioma da requisicao. O argumento {0}
# sempre chega como String, para o MessageFormat nao formatar numero
# (9999 viraria 9.999 em pt-BR e quebraria a mensagem).

# Acesso
acesso.negado=Acesso negado
recurso.nao.encontrado=Recurso não encontrado

# Generico
erro.interno=Erro interno do servidor
payload.invalido=Payload inválido
metodo.nao.suportado=Método não suportado

# Recursos (404)
restaurante.nao.encontrado=Restaurante não encontrado
permissao.nao.encontrada=Permissão não encontrada
cargo.nao.encontrado=Cargo não encontrado

# Duplicidade (409)
permissao.duplicada=Chave de permissão já cadastrada
permissao.em.uso=Permissão vinculada a um cargo não pode ser removida
cnpj.duplicado=CNPJ já cadastrado para outro restaurante

# Regras de negocio (422)
chave.imutavel=A chave da permissão é imutável após a criação
permissoes.inexistentes=Permissões inexistentes: {0}
id.divergente=O id enviado não corresponde ao restaurante configurado

# Validacao de dominio (400)
cnpj.invalido=CNPJ inválido
