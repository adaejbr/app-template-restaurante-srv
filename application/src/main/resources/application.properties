spring.application.name=application

# Datasource (env vars com fallback local — Spring NÃO lê .env, só o docker-compose lê)
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:restaurante_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:rest_user}
spring.datasource.password=${DB_PASSWORD:rest_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

